name: Check dental board sites

on:
  schedule:
    - cron: "0 13 * * 1"  # Mondays at 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-sites
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run site check
        env:
          # MailerSend SMTP. Host/port are public; credentials come from repo secrets.
          SMTP_HOST: smtp.mailersend.net
          SMTP_PORT: "587"
          SMTP_USERNAME: ${{ secrets.MAILERSEND_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.MAILERSEND_SMTP_PASS }}
          SMTP_FROM_EMAIL: ${{ secrets.MAILERSEND_FROM }}
          ALERT_TO_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python scripts/check_sites.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update site state [skip ci]"
            git push
          fi
